# Tooling config only. This project is a Hermes plugin, not a pip package: Hermes loads
# plugin.yaml and __init__.py directly.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# S603/S607: running `gh` and `hermes` from PATH, with argument lists and never a shell, is
# what this plugin does. There is no shell string anywhere.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# S105: test tokens such as "tok-coder" are not passwords.
"tests/*" = ["S101", "S105", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

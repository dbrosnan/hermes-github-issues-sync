name: github-issues-sync
version: 0.2.0
description: "Mirror agent-ready GitHub issues onto the Hermes kanban board, one card per issue, and report claims, handoffs and blocks back on the issue. Pull-based through the gh CLI; the merged PR closes the issue."
author: Drew Brosnan
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.5"
license: MIT
homepage: https://github.com/dbrosnan/hermes-github-issues-sync
tags: [github, issues, kanban, automation]
provides_hooks: [kanban_task_claimed, kanban_task_completed, kanban_task_blocked, on_kanban_dispatch_tick]
config_schema:
  repos: {type: list, default: [], label: "Repositories", description: "GitHub repositories to mirror, as owner/repo strings or maps with repo and any of workspace, assignee, lanes, completion_contract, branch_prefix, max_runtime."}
  assignee: {type: str, default: "", label: "Assignee profile", description: "Hermes profile that works cards no lane label routes. Required unless lanes or every repo sets its own."}
  workspace_root: {type: str, default: "", label: "Workspace root", description: "Directory holding one checkout per repo (<root>/<repo name>). Cards get a worktree of that checkout. Required unless every repo sets workspace."}
  lanes: {type: dict, default: {}, label: "Lanes", description: "Issue label to Hermes profile, consulted before assignee: an issue with exactly one of these labels is routed to that profile; with two it is skipped and reported. Per-repo maps can add or override entries."}
  board: {type: str, default: "", label: "Board", description: "Kanban board slug for the cards. Empty uses the current board."}
  ready_label: {type: str, default: "agent-ready", label: "Ready label", description: "Only open issues with this label are mirrored."}
  in_progress_label: {type: str, default: "in-progress", label: "In-progress label", description: "Added when a card is claimed. Issues already carrying it are not mirrored."}
  blocked_label: {type: str, default: "blocked", label: "Blocked label", description: "Added when a card is blocked, removed when it is claimed again."}
  skip_labels: {type: list, default: [epic], label: "Skip labels", description: "Issues with any of these labels are never mirrored."}
  branch_prefix: {type: str, default: "issue-", label: "Branch prefix", description: "Card branch is <prefix><issue number>."}
  max_runtime: {type: str, default: "90m", label: "Max runtime", description: "Per-card runtime cap passed to hermes kanban create."}
  completion_contract: {type: str, default: "local-only", label: "Completion contract", description: "local-only, OWNER/REPO when the repo has required checks, or a GitHub PR URL. Per-repo maps can override it."}
  max_cards_per_sync: {type: int, default: 10, label: "Cards per sync", description: "Upper bound on cards one sync may create."}
  issue_limit: {type: int, default: 100, label: "Issues per repo", description: "How many ready issues to fetch per repo."}
  sync_on_dispatch_tick: {type: bool, default: true, label: "Sync on dispatcher ticks", description: "Run the pull in the background after dispatcher ticks, at most once per sync interval."}
  sync_interval_seconds: {type: int, default: 300, label: "Sync interval", description: "Minimum seconds between tick-triggered syncs."}
  reconcile: {type: bool, default: true, label: "Reconcile on sync", description: "During a sync, post claim, handoff and block events for mirrored cards that no hook posted yet."}
  push_events: {type: list, default: [claimed, completed, blocked], label: "Push events", description: "Which card transitions are reported on the issue."}
  summary_chars: {type: int, default: 2000, label: "Summary length", description: "Characters of the handoff summary or block reason posted on the issue."}
  card_template: {type: str, default: "", label: "Card template", description: "Custom card body template. Empty uses the built-in one; a template that fails to render logs a warning and the built-in one is used."}
  created_by: {type: str, default: "github-issues-sync", label: "Created by", description: "Author recorded on cards and card comments."}
  require_profile_login: {type: bool, default: false, label: "Require profile gh login", description: "Never let gh fall back to its stored login: a profile without its own GH_TOKEN or GH_CONFIG_DIR runs gh against an empty config directory (exit 4), and a missing profile is an error."}
  command_timeout_seconds: {type: int, default: 30, label: "Command timeout", description: "Seconds allowed for each gh command; hermes commands get twice that, at least 60."}
  gh_bin: {type: str, default: "gh", label: "gh command", description: "The gh executable."}
  hermes_bin: {type: str, default: "hermes", label: "hermes command", description: "The hermes executable."}
